<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System_Root // Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #0f0;
            --glitch-red: #ff0055;
            --dim-text: #444;
            --scanline-color: rgba(0, 255, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: text; /* Terminal feel */
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* --- CRT Scanline Effect --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                var(--scanline-color) 50%,
                rgba(0, 0, 0, 0) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Canvas Background --- */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.25; /* Subtle background movement */
        }

        /* --- Main Container --- */
        .container {
            position: relative;
            z-index: 5;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- Hero Section --- */
        .hero-box {
            border: 2px solid var(--terminal-green);
            padding: 2rem;
            background: rgba(5, 5, 5, 0.9);
            box-shadow: 0 0 15px var(--terminal-green);
            animation: bootUp 0.5s ease-out;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.5;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px var(--dim-text);
        }

        .typewriter {
            font-size: 1.5rem;
            color: var(--terminal-green);
            border-right: 10px solid var(--terminal-green);
            white-space: nowrap;
            overflow: hidden;
            animation: blinkingCursor 0.8s steps(2) infinite;
            display: inline-block;
            max-width: 100%;
        }

        p.bio {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            color: #ccc;
            line-height: 1.6;
        }

        /* --- Gamified Navigation (Quest Log) --- */
        .quest-log {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .quest-item {
            background: transparent;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 1rem;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.1s;
            text-decoration: none;
            position: relative;
        }

        .quest-item:hover {
            background: var(--terminal-green);
            color: var(--bg-color);
            box-shadow: 5px 5px 0px var(--glitch-red);
            transform: translate(-2px, -2px);
        }

        /* --- Glitch Animation Keyframes --- */
        @keyframes blinkingCursor {
            0% { border-right-color: var(--terminal-green); }
            50% { border-right-color: transparent; }
            100% { border-right-color: var(--terminal-green); }
        }

        @keyframes bootUp {
            0% { transform: scaleY(0.005) scaleX(0); opacity: 0; }
            50% { transform: scaleY(0.005) scaleX(1); }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 600px) {
            h1 { font-size: 1.2rem; }
            .typewriter { font-size: 1rem; border-right-width: 5px; }
            .hero-box { padding: 1rem; }
            .quest-item { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="hero-box">
            <div style="margin-bottom: 10px; color: var(--glitch-red); font-size: 0.9rem;">
                > SYSTEM_READY...<br>
                > USER_DETECTED
            </div>
            
            <h1>HELLO, I AM <br><span style="color:white;">[YOUR NAME]</span></h1>
            
            <div class="typewriter" id="typing-text"></div>

            <p class="bio">
                // Level 25 Full-Stack Developer based in the Cloud.<br>
                // Specializing in building digital experiences that survive the apocalypse.
            </p>

            <div class="quest-log">
                <a href="#" class="quest-item">[ PROJECTS ]</a>
                <a href="#" class="quest-item">[ SKILLS ]</a>
                <a href="#" class="quest-item">[ CONTACT ]</a>
                <a href="#" class="quest-item">[ LOGOUT ]</a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Typewriter Effect ---
        const textToType = "CREATIVE_DEVELOPER_";
        const typeWriterElement = document.getElementById('typing-text');
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                typeWriterElement.textContent += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, 150); // Speed of typing
            }
        }
        
        // Start typing after a slight delay
        setTimeout(typeWriter, 1000);


        // --- 2. Pixel Rain Background (Canvas) ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to full screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Configuration
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = []; // Array to store vertical position of drops

        // Initialize drops (start at random vertical positions for variety)
        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * canvas.height;
        }

        function drawMatrix() {
            // Semi-transparent black background to create "trail" effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0'; // Green text
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                // Random characters: 0, 1, and some katakana/glitch chars
                const chars = "010101010101XYZ<>?[]"; 
                const text = chars.charAt(Math.floor(Math.random() * chars.length));

                // Draw the character
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Move drop down
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0; // Reset to top randomly
                }
                drops[i]++;
            }
        }

        // Loop the animation
        setInterval(drawMatrix, 35);

    </script>
</body>
</html>
